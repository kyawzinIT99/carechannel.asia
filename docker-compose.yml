services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ram_hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ram_pg:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ram_hospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
    env_file:
      - ./apps/web/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ram_hospital?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ram_pg:
