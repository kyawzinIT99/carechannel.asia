# CareChannel: existing Starter service + existing 1 GB disk (like SDDP).
# Do not change the disk mount path. Point DATABASE_URL at that mount.
# n8n stays on Hostinger. Do not touch BCC / PDF / SDDP.

services:
  - type: web
    name: carechannel
    runtime: node
    plan: starter
    region: singapore
    repo: https://github.com/kyawzinIT99/carechannel.asia.git
    branch: main
    autoDeployTrigger: commit
    rootDir: apps/web
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /en
    disk:
      name: carechannel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        value: file:/var/data/carechannel.db
      - key: SITE_URL
        value: https://carechannel.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_ALERT_EMAIL
        value: itsolutions.mm@gmail.com
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: N8N_INQUIRY_WEBHOOK
        value: https://n8n-al8a.srv1707349.hstgr.cloud/webhook/ram-hospital-inquiry
      - key: TELEGRAM_STAFF_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
